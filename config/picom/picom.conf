backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [ "class_g = 'Polybar'", "class_g = 'Plank'", "_GTK_FRAME_EXTENTS@:c", "_NET_WM_WINDOW_TYPE:a *= '_NET_WM_WINDOW_TYPE_DND'" ];
fading = true;
fade-delta = 4;
fade-in-step = 0.08;
fade-out-step = 0.08;
unredir-if-possible = true;
# SDL games ask to bypass the compositor even when windowed or left with Alt+Tab:
# obey only while the game is fullscreen and focused
# (flameshot covers the whole screen too, and the desktop must keep its look behind it)
unredir-if-possible-exclude = [ "!fullscreen || !focused", "class_g ?= 'flameshot'" ];
# shadows are rectangular, so nothing with rounded corners gets one (Qt menus draw their own)
wintypes: {
    dock = { shadow = false; };
    dnd = { shadow = false; };
    menu = { shadow = false; };
    dropdown_menu = { shadow = false; };
    popup_menu = { shadow = false; };
    combo = { shadow = false; };
    tooltip = { shadow = false; };
    notification = { shadow = false; };
};
# smooth round window buttons (Openbox theme Gruvbox-Round); glx only
window-shader-fg = "round-buttons.glsl";
window-shader-fg-rule = [ "dock-lift.glsl:class_g = 'Plank'", "default:window_type = 'dock'", "default:window_type = 'desktop'" ];
